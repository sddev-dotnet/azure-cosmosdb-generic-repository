on:
  push:
    tags:
      # Accept both "v"-prefixed and bare semver tags.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
name: Build and Publish NuGet Packages

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is required for the HEAD~1 change detection below.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine package version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not resolve to a valid semver version." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Determine changes in Contracts
        id: changes-contracts
        run: |
          if git diff --name-only HEAD HEAD~1 | grep -q '^SDDev.Net.GenericRepository.Contracts/'; then echo "changed_contracts=true" >> $GITHUB_ENV; else echo "changed_contracts=false" >> $GITHUB_ENV; fi
        shell: bash

      - name: Determine changes in Repositories
        id: changes-repositories
        run: |
          if git diff --name-only HEAD HEAD~1 | grep -q '^SDDev.Net.GenericRepository/'; then echo "changed_repositories=true" >> $GITHUB_ENV; else echo "changed_repositories=false" >> $GITHUB_ENV; fi
        shell: bash

      - name: Build and Publish Contracts
        if: env.changed_contracts == 'true'
        run: |
          dotnet pack SDDev.Net.GenericRepository.Contracts/SDDev.Net.GenericRepository.Contracts.csproj -c Release -p:PackageVersion=${{ steps.version.outputs.version }} -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true -o ./SDDev.Net.GenericRepository.Contracts/output
          dotnet nuget push ./SDDev.Net.GenericRepository.Contracts/output/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Build and Publish Repositories
        if: env.changed_repositories == 'true'
        run: |
          dotnet pack SDDev.Net.GenericRepository/SDDev.Net.GenericRepository.csproj -c Release -p:PackageVersion=${{ steps.version.outputs.version }} -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true -o ./SDDev.Net.GenericRepository/output
          dotnet nuget push ./SDDev.Net.GenericRepository/output/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
